<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI Conf 2025 — recorded demo flow</title>
<!--
  AIC-5 — the last-resort fallback. Captured from a real browser driving the
  real page; every frame is a screenshot of a step that actually ran and passed.

  Deliberately a stepper rather than a video: on stage the founder narrates at
  their own pace, and a video either outruns them or has to be scrubbed. Space
  or the arrow keys advance. `demo.gif` next to this file is the same flow as a
  plain looping image if something refuses to run this page.
-->
<style>
  * { box-sizing: border-box; }
  body {
    margin:0; background:#000; color:#e5e7eb; height:100vh;
    display:flex; flex-direction:column;
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;
    padding:12px clamp(14px,2vw,28px); border-bottom:1px solid #1f2937;
  }
  .step { font-size: clamp(15px,1.7vw,22px); font-weight:600; }
  .say { color:#9ca3af; font-size: clamp(13px,1.4vw,18px); }
  .pos { margin-left:auto; color:#6b7280; font-variant-numeric:tabular-nums; }
  figure { margin:0; flex:1; display:grid; place-items:center; padding:14px; min-height:0; }
  img { max-width:100%; max-height:100%; object-fit:contain; border:1px solid #1f2937; border-radius:8px; }
  footer { padding:10px clamp(14px,2vw,28px); border-top:1px solid #1f2937; display:flex; gap:10px; align-items:center; }
  button {
    background:#111827; color:#e5e7eb; border:1px solid #374151; border-radius:8px;
    padding:.5em 1.1em; font-size:15px; cursor:pointer;
  }
  button:hover { background:#1f2937; }
  .hint { color:#6b7280; margin-left:auto; font-size:13px; }
</style>
</head>
<body>
<header>
  <span class="step" id="title"></span>
  <span class="say" id="say"></span>
  <span class="pos" id="pos"></span>
</header>
<figure><img id="frame" alt="" /></figure>
<footer>
  <button id="prev">← Back</button>
  <button id="next">Next →</button>
  <button id="play">Play</button>
  <span class="hint">Space / arrow keys. All 12 checks passed on this run.</span>
</footer>

<script>
var STEPS = [
  ['01-hero.png',          'Hero',              'One route, static export. Event, tagline, date, CTA.'],
  ['02-agenda.png',        'Agenda',            'Static config — no fetch, nothing to fail on stage.'],
  ['03-speakers.png',      'Speakers',          'Three cards, initials avatars, no external images.'],
  ['04-form-empty.png',    'Registration form', 'Name and email. That is the entire schema.'],
  ['05-form-filled.png',   'Submit',            'Browser client posts straight to the database.'],
  ['06-success.png',       'Registered',        'Form is replaced. Nothing else on the wall.'],
  ['07-database-row.png',  'The row',           'Same row, in the table, one second later.'],
  ['08-duplicate.png',     'Same email again',  'Unique violation 23505 → "You’re already registered."']
];

var i = 0, timer = null;
var img = document.getElementById('frame');

function draw() {
  var s = STEPS[i];
  img.src = s[0];
  img.alt = s[1];
  document.getElementById('title').textContent = s[1];
  document.getElementById('say').textContent = s[2];
  document.getElementById('pos').textContent = (i + 1) + ' / ' + STEPS.length;
}
function go(d) {
  i = (i + d + STEPS.length) % STEPS.length;
  draw();
}
function toggle() {
  var b = document.getElementById('play');
  if (timer) { clearInterval(timer); timer = null; b.textContent = 'Play'; return; }
  timer = setInterval(function () { go(1); }, 2600);
  b.textContent = 'Pause';
}

document.getElementById('next').onclick = function () { go(1); };
document.getElementById('prev').onclick = function () { go(-1); };
document.getElementById('play').onclick = toggle;
document.addEventListener('keydown', function (e) {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); go(1); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); go(-1); }
});

draw();
</script>
</body>
</html>
